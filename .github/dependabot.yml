version: 2

updates:
  # 依赖自动更新。本项目 dependencies 恒为空，此配置主要覆盖 devDependencies。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    # 平台包与类型定义分开归类，便于审阅
    groups:
      platform-types:
        patterns:
          - '@deepseek-ai/*'
          - '@types/*'
      tooling:
        patterns:
          - typescript

  # GitHub Actions 版本自动更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci)'
